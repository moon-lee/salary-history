<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Income Flow - dev</title>
    <link rel="stylesheet" href="/src/styles/ext-tokens.css" />
    <style>
      #view-switcher {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 9999;
        padding: 4px 8px;
        font-size: 12px;
        background: var(--ff-bg-secondary, #1e1e1e);
        color: var(--ff-text-primary, #ccc);
        border: 1px solid var(--ff-border, #444);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <select id="view-switcher"></select>
    <script type="module">
      import '/src/ui/index.ts';
      import { createMockFinance } from '/src/mock/finance-mock.ts';
      import * as main from '/src/main.ts';

      const VIEWS = [
        {
          tag: 'salary-orchestrator',
          label: 'Orchestrator',
          view: 'payslip-list',
        },
        { tag: 'payslip-list', label: 'Pay History', view: 'payslip-list' },
        { tag: 'payslip-form', label: 'Payslip form', view: 'payslip-form' },
        {
          tag: 'pay-rate-history-view',
          label: 'Rate history',
          view: 'pay-rate-history-view',
        },
        { tag: 'rate-row-form', label: 'Rate form', view: 'rate-row-form' },
        {
          tag: 'reorder-sections-modal',
          label: 'Reorder sections',
          view: 'reorder-sections-modal',
        },
      ];

      const switcher = document.getElementById('view-switcher');
      VIEWS.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.text = v.label;
        switcher.appendChild(opt);
      });

      const finance = createMockFinance();
      // Dev console hook for the gitignored seed module:
      //   const m = await import('/src/seed/salary-seed.ts');
      //   await m.seedSalaryHistory(window.__finance);
      window.__finance = finance;
      let current = null;

      // ---- ?seed (or ?seed=1) loads src/seed/salary-seed.ts before mount ----
      // The seed module is gitignored, so a missing file is not an error: the
      // dev DB just stays empty. Applies to every view in the VIEWS dropdown.
      if (/(?:^|[?&])seed(?:=1)?(?:&|$)/.test(location.search)) {
        try {
          const seed = await import(
            /* @vite-ignore */ '/src/seed/salary-seed.ts'
          );
          const done = await seed.seedSalaryHistory(finance);
          console.info('[salary-history] seeded', done);
        } catch (e) {
          console.warn('[salary-history] seed skipped:', e?.message ?? e);
        }
      }

      async function mountView(index) {
        if (current) {
          current.remove();
          current = null;
        }
        const v = VIEWS[index];
        const el = document.createElement(v.tag);
        document.getElementById('app').appendChild(el);
        current = el;
        // activate() takes over #app and mounts the orchestrator itself, so
        // the selection must ride in mountData.view (the production single-
        // panel convention) — otherwise every selection lands on the default
        // payslip-list view.
        if (typeof main.activate === 'function')
          await main.activate(finance, { viewId: 'salary', view: v.view });
      }

      switcher.addEventListener('change', (e) => mountView(+e.target.value));
      await mountView(0);
    </script>
  </body>
</html>
